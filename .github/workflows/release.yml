# Release automation: on a version tag, build the sdist + wheel and attach them
# to the GitHub release.
#
# PyPI publishing is DISABLED for the Public Preview: the pypi job runs only
# when the repository variable PUBLISH_TO_PYPI is set to "true" (Settings >
# Secrets and variables > Actions > Variables). Before enabling it, complete
# the one-time trusted-publishing setup at
# https://pypi.org/manage/account/publishing/ — add this repo
# (motherduckdb/md-migration-assessment), workflow release.yml, environment
# `pypi` — under a MotherDuck-owned PyPI identity, not a personal account.
# The release-assets job is separate on purpose so assets attach regardless.

name: release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.22"
      - name: Check tag matches project version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - run: uv build
      - run: |
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
          # PEP 440 pre-release tags (rc/a/b/dev) publish as GitHub prereleases
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'dev') }}

  pypi:
    needs: build
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC); no long-lived token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
