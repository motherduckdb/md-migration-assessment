[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-migration-assessment"
version = "0.1.4"
description = "MotherDuck migration assessment: inventory a source data warehouse into DuckDB and assess what a migration entails (Snowflake adapter included)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=16",
    "typer>=0.12",
]

# Warehouse client libraries are per-source extras: install the one for the
# source you are assessing, e.g. `pip install 'md-migration-assessment[snowflake]'`.
# The adapter imports its client lazily and reports a clear error if the
# extra is missing.
[project.optional-dependencies]
snowflake = [
    # [pandas] is required even though we never materialize pandas objects:
    # the connector's fetch_arrow_all() gates on pandas being installed.
    "snowflake-connector-python[pandas]>=4.7.1",  # <4.7.1: TLS hostname verification flaw (GHSA, critical)
]
dev = [
    "pytest>=8",
    "md-migration-assessment[snowflake]",
]

[project.urls]
Repository = "https://github.com/motherduckdb/md-migration-assessment"

[project.scripts]
md-assess = "md_migration_assessment.cli:app"

[tool.hatch.build]
# The dashboard bundle and the Dive source are build outputs (gitignored), so
# hatch would drop them; `artifacts` includes them when present at build time.
artifacts = [
    "src/md_migration_assessment/dashboard/static/",
    "src/md_migration_assessment/dashboard/dive.tsx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/md_migration_assessment"]

[tool.hatch.build.targets.sdist]
# Source only. dive/ authoring files travel so the sdist can rebuild the
# bundle; npm dependencies and build outputs never do (hatch reads only the
# root .gitignore, so dive/.gitignore alone does not keep them out).
exclude = [
    "dive/node_modules",
    "dive/.build",
    ".dive-preview",
    "dist",
    "*.duckdb",
    "*.duckdb.wal",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
