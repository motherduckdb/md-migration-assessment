[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-migration-assessment"
version = "0.1.0.dev0"
description = "Snowflake -> MotherDuck migration assessment: inventory a Snowflake account into DuckDB and assess what a migration entails."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=16",
    # [pandas] is required even though we never materialize pandas objects:
    # the connector's fetch_arrow_all() gates on pandas being installed.
    "snowflake-connector-python[pandas]>=3.12",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
md-assess = "md_migration_assessment.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/md_migration_assessment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
